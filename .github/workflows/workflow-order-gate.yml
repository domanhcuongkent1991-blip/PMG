name: Workflow Order Gate

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  workflow_order_gate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce workflow order rules
        shell: pwsh
        run: |
          if (-not (Test-Path ".\.workflow-gate\check-workflow-order.ps1")) {
            throw "Missing .workflow-gate/check-workflow-order.ps1"
          }
          powershell -ExecutionPolicy Bypass -File .\.workflow-gate\check-workflow-order.ps1 -ProjectRoot "." -EnforceSourceApproval
